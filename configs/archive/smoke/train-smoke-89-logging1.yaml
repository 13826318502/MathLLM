model_name_or_path: "./models/Qwen2.5-7B-Instruct-modelscope"
seed: 42

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "./outputs/smoke-89-logging1"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  warmup_ratio: 0.03
  logging_steps: 1
  save_steps: 1
  save_total_limit: 3
  eval_steps: 1
  per_device_eval_batch_size: 1
  gradient_checkpointing: true
  use_4bit: true
  bf16: true
  max_seq_length: 2048

data:
  train_file: "./data/processed/train.json"
  eval_file: "./data/processed/eval.json"
  eval_ratio: 0.1
