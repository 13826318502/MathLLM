# Active training config: correction-round-3-20260904.
# Start from the previous merged model and learn new correction patterns.
model_name_or_path: "./outputs/correction-round-2-merged"
seed: 42

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "./outputs/correction-round-3"
  num_train_epochs: 3
  # QLoRA avoids the previous 24 GB GPU OOM; effective batch size is 8.
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  warmup_ratio: 0.03
  logging_steps: 5
  save_steps: 10
  save_total_limit: 3
  eval_steps: 10
  per_device_eval_batch_size: 1
  gradient_checkpointing: true
  use_4bit: true
  bf16: true
  max_seq_length: 2048

data:
  train_file: "./data/processed/round-3-staging/train.json"
  eval_file: "./data/processed/round-3-staging/eval.json"
  eval_ratio: 0.1
