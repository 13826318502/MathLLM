# Active training config: correction-round-7-20260905.
# Single-model run: continue from the Round 6 merged model with a controlled
# 70% correction / 30% ordinary replay mixture. No comparison model is used.
model_name_or_path: "./outputs/correction-round-6-merged"
seed: 42

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "./outputs/correction-round-7"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  # Conservative learning rate for continuing from a merged model.
  learning_rate: 5.0e-6
  warmup_ratio: 0.05
  logging_steps: 5
  save_steps: 10
  save_total_limit: 3
  eval_steps: 10
  per_device_eval_batch_size: 1
  gradient_checkpointing: true
  use_4bit: true
  bf16: true
  max_seq_length: 2048

data:
  train_file: "./data/processed/round-7-staging/train.json"
  eval_file: "./data/processed/round-7-staging/eval.json"
  eval_ratio: 0.1
