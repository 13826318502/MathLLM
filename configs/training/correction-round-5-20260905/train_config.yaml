# Active training config: correction-round-5-20260905.
# Continue from the stable Round 4 merged model with original-data replay and
# new Round 5 correction data. The old Round 4 correction source is excluded
# during data preparation to avoid repeatedly oversampling the same corrections.
model_name_or_path: "./outputs/correction-round-4-merged"
seed: 42

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "./outputs/correction-round-5"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  warmup_ratio: 0.05
  # Transformers 5.x may not expose warmup_ratio; 7 steps is about 5% of
  # the expected 132 optimization steps for this staging set.
  warmup_steps: 7
  logging_steps: 5
  save_steps: 10
  save_total_limit: 3
  eval_steps: 10
  per_device_eval_batch_size: 1
  gradient_checkpointing: true
  use_4bit: true
  bf16: true
  max_seq_length: 2048

data:
  train_file: "./data/processed/round-5-staging/train.json"
  eval_file: "./data/processed/round-5-staging/eval.json"
  eval_ratio: 0.1
