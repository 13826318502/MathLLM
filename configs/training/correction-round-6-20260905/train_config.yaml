# Active training config: correction-round-6-20260905.
# Continue from the Round 5 merged model with original-data replay and
# newly generated Round 6 correction data. Round 4 and Round 5 correction
# sources are excluded when round-6-staging is built.
model_name_or_path: "./outputs/correction-round-5-merged"
seed: 42

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "./outputs/correction-round-6"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-5
  warmup_ratio: 0.05
  # With 1155 training records and accumulation 8, this is approximately 5%
  # of the 145 optimization steps.
  warmup_steps: 7
  logging_steps: 5
  save_steps: 10
  save_total_limit: 3
  eval_steps: 10
  per_device_eval_batch_size: 1
  gradient_checkpointing: true
  use_4bit: true
  bf16: true
  max_seq_length: 2048

data:
  train_file: "./data/processed/round-6-staging/train.json"
  eval_file: "./data/processed/round-6-staging/eval.json"
  eval_ratio: 0.1
