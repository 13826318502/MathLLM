model_name_or_path: "Qwen/Qwen2.5-7B-Instruct"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "./outputs/math-lora"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 100
  save_total_limit: 3
  bf16: true
  max_seq_length: 2048

data:
  train_file: "./data/processed/train.json"
  eval_file: "./data/processed/eval.json"
  eval_ratio: 0.1
